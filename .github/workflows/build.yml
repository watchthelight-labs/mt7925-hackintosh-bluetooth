name: build
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MtkBt
          path: out/MtkBt.kext
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p MtkBt-${GITHUB_REF_NAME}
          cp -R out/MtkBt.kext LICENSE NOTICE.md LICENSES MtkBt-${GITHUB_REF_NAME}/
          zip -r MtkBt-${GITHUB_REF_NAME}-ci.zip MtkBt-${GITHUB_REF_NAME}
          gh release upload "$GITHUB_REF_NAME" MtkBt-${GITHUB_REF_NAME}-ci.zip
